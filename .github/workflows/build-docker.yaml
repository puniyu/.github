name: Build Package


on:
  workflow_call:
    inputs:
      dockerfile:
        description: 'Dockerfile path'
        type: string
        required: true
      image_name:
        description: 'Image name'
        type: string
        required: true

jobs:
  build_amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          file: ${{ inputs.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: "ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}:amd64"
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build_arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          file: ${{ inputs.dockerfile }}
          platforms: linux/arm64
          push: true
          tags: "ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}:latest"
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    needs: [build_amd64, build_arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - run: |
          docker buildx imagetools create \
            -t ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}:latest \
            ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}:amd64 \
            ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}:arm64

      - run: |
          docker buildx imagetools inspect ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}:latest

        


